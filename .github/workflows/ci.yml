name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the running workflow obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage (informational)
        run: go tool cover -func=coverage.out | tail -1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GitHub-hosted runners ship with Docker, which testcontainers uses.
      - name: Integration tests
        run: make test-integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t notification-service:ci .
      - name: Validate compose file
        run: docker compose config --quiet
