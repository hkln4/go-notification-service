global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: relay
    static_configs:
      - targets: ["relay:9100"]

  # The compose DNS name "worker" resolves to every replica, so scaling the
  # workers needs no config change.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s
