# Every value has a default, so `docker compose up` works without a .env file.
# Copy .env.example to .env only to override something, e.g. a host port that
# is already taken on your machine (POSTGRES_PORT, RABBITMQ_PORT, ...).

# Shared by every Go service: one image, the binary is picked by `command`.
x-app: &app
  build: .
  image: notification-service:local
  restart: unless-stopped

x-database-url: &database-url postgres://${POSTGRES_USER:-notification}:${POSTGRES_PASSWORD:-notification}@postgres:5432/${POSTGRES_DB:-notification}?sslmode=disable
x-amqp-url: &amqp-url amqp://${RABBITMQ_USER:-notification}:${RABBITMQ_PASSWORD:-notification}@rabbitmq:5672/
x-otlp: &otlp ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notification}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notification}
      POSTGRES_DB: ${POSTGRES_DB:-notification}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.8-management-alpine
    environment:
      # The default guest user may only connect from localhost,
      # so other containers need a real user.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-notification}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-notification}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations and exits 0. App services wait on it
  # with condition: service_completed_successfully.
  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    # Flags live in the entrypoint so `docker-compose run --rm migrate down 1`
    # only has to pass the subcommand.
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-notification}:${POSTGRES_PASSWORD:-notification}@postgres:5432/${POSTGRES_DB:-notification}?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["/app/api"]
    environment:
      DATABASE_URL: *database-url
      AMQP_URL: *amqp-url
      REDIS_ADDR: redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETRY_DELAYS: ${RETRY_DELAYS:-5s,30s,2m,10m}
      BACKPRESSURE_LIMIT: ${BACKPRESSURE_LIMIT:-50000}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  relay:
    <<: *app
    command: ["/app/relay"]
    environment:
      DATABASE_URL: *database-url
      AMQP_URL: *amqp-url
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETRY_DELAYS: ${RETRY_DELAYS:-5s,30s,2m,10m}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Scale with: docker compose up --scale worker=3
  worker:
    <<: *app
    command: ["/app/worker"]
    # Longer than SHUTDOWN_TIMEOUT (10s), so Docker doesn't SIGKILL a worker
    # that is still finishing in-flight messages.
    stop_grace_period: 15s
    environment:
      DATABASE_URL: *database-url
      AMQP_URL: *amqp-url
      REDIS_ADDR: redis:6379
      PROVIDER_URL: ${PROVIDER_URL:-http://mockprovider:9090/}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETRY_DELAYS: ${RETRY_DELAYS:-5s,30s,2m,10m}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-95}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mockprovider:
        condition: service_started

  # Stands in for webhook.site, which stops answering after ~100 free
  # requests. Point PROVIDER_URL at webhook.site in .env to use it instead.
  mockprovider:
    <<: *app
    command: ["/app/mockprovider"]
    environment:
      FAILURE_RATE: ${FAILURE_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-50}
    ports:
      - "9090:9090"

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090" # 9090 is the mock provider
    depends_on:
      - api

  # Traces: UI on http://localhost:16686. Services send OTLP/HTTP to :4318.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"

volumes:
  postgres-data:
